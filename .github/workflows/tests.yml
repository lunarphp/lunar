name: Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [2.x]
  schedule:
    # Daily full-matrix sweep to catch dependency drift on the lower combos.
    - cron: "0 6 * * *"

concurrency:
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs run a slimmed matrix; push and the schedule run the full one.
        php: ${{ fromJSON(github.event_name == 'pull_request' && '["8.4"]' || '["8.4","8.5"]') }}
        laravel: ["12.*", "13.*"]
        dependency-version: [prefer-stable]
        testsuite: [core, admin, filament, shipping, stripe, search, upgrade]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
    name: ${{ matrix.testsuite }} - PHP ${{ matrix.php }} - L${{ matrix.laravel }} ${{ matrix.dependency-version == 'prefer-lowest' && '↓' || '↑' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Pin Laravel + Testbench versions
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--prefer-dist ${{ matrix.dependency-version == 'prefer-lowest' && '--prefer-lowest' || '' }}"
          custom-cache-key: composer-p${{ matrix.php }}-l${{ matrix.laravel }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.json') }}

      - name: Execute tests
        env:
          APP_ENV: testing
          DB_CONNECTION: testing
          DB_DATABASE: ":memory:"
        run: ./vendor/bin/pest --testsuite ${{ matrix.testsuite }} --parallel

  cross-db-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [mysql, pgsql]
    name: cross-db - ${{ matrix.driver }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lunar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lunar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Pin Laravel + Testbench versions
        run: |
          composer require "laravel/framework:13.*" --no-update --no-interaction
          composer require "orchestra/testbench:11.*" --dev --no-update --no-interaction

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--prefer-dist"
          custom-cache-key: composer-p8.4-l13.*-prefer-stable-${{ hashFiles('composer.json') }}

      - name: Execute cross-db tests (mysql)
        if: matrix.driver == 'mysql'
        env:
          APP_ENV: testing
          DB_CONNECTION: testing
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: lunar_test
          DB_USERNAME: root
          DB_PASSWORD: root
        # --do-not-fail-on-empty-test-suite: Pest 4's parallel runner miscounts a
        # group-filtered suite as empty when a worker handles 2+ files, flipping the
        # exit code to 1 despite all tests passing. The cross-db group is never empty.
        run: ./vendor/bin/pest --group=cross-db --parallel --do-not-fail-on-empty-test-suite

      - name: Execute cross-db tests (pgsql)
        if: matrix.driver == 'pgsql'
        env:
          APP_ENV: testing
          DB_CONNECTION: testing
          DB_DRIVER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: lunar_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        # See the mysql step above for why --do-not-fail-on-empty-test-suite is needed.
        run: ./vendor/bin/pest --group=cross-db --parallel --do-not-fail-on-empty-test-suite
