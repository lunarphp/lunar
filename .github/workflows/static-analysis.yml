name: "Static Analysis"

on:
  pull_request:

concurrency:
  group: sa-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

jobs:
  static-analysis:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        laravel: ["^11.0", "^12.0"]
        dependencies: ["highest"]
        exclude:
          - php: "8.2"
            laravel: "^11.0"
          - php: "8.2"
            laravel: "^12.0"
        include:
          - php: "8.4"
            laravel: "^12.0"
            filament: "^5.0"
            dependencies: "highest"
    name: "PHP ${{ matrix.php }} - L${{ matrix.laravel }}${{ matrix.filament && format(' - F{0}', matrix.filament) || '' }} ${{ matrix.dependencies == 'highest' && '↑' || '↓' }}"

    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php }}"
          extensions: "dom, curl, libxml, mbstring, zip, fileinfo"
          tools: "composer:v2"
          coverage: "none"

      - name: "Install dependencies from composer.json"
        if: "matrix.dependencies != 'lowest'"
        run: |
          EXTRA=""
          if [ -n "${{ matrix.filament }}" ]; then
            EXTRA="--with=filament/filament:${{ matrix.filament }}"
          fi
          composer update --with='laravel/framework:${{ matrix.laravel }}' $EXTRA --no-interaction --no-progress

      - name: "Install lowest dependencies from composer.json"
        if: "matrix.dependencies == 'lowest'"
        run: "composer update --with='laravel/framework:${{ matrix.laravel }}' --no-interaction --no-progress --prefer-lowest"

      - name: "Run PHPStan"
        run: ./vendor/bin/phpstan
